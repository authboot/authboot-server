syntax = "proto3";

package user;

import "api.proto";
import "common.proto";

option go_package = "user";

message User {
  int64 id = 1;
  int64 organization_id = 2;
  string nickname = 3;
  string avatar = 4;
  common.Status status = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // 管理端可见的档案与联系信息（不含 password / settings 等敏感字段）。
  // email/phone 取自 tb_user_identities 绑定身份，非独立列。
  common.Gender gender = 8;
  string birthday = 9;
  string bio = 10;
  string background_image = 11;
  string signature = 12;
  string email = 13;
  string phone = 14;
}

message UserIdentity {
  int64 id = 1;
  int64 organization_id = 2;
  int64 user_id = 3;
  common.IdentityType identity_type = 4;
  string identity_value = 5;
  bool verified = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message UserProfile {
  int64 user_id = 1;
  int64 organization_id = 2;
  string nickname = 3;
  string avatar = 4;
  common.Gender gender = 5;
  string birthday = 6;
  string bio = 7;
}

message GetUserRequest {
  int64 organization_id = 1;
  int64 user_id = 2;
}

message GetUserResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  User user = 3[(api.go_tag)='json:"user"'];
}

message GetUserByIdentityRequest {
  int64 organization_id = 1;
  common.IdentityType identity_type = 2;
  string identity_value = 3;
}

message GetUserByIdentityResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  User user = 3[(api.go_tag)='json:"user"'];
}

message ListUsersRequest {
  int64 organization_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  // 模糊匹配用户名 / 邮箱 / 手机号。
  string search = 4 [(api.query) = "search"];
  // 精确字段过滤（模糊匹配）。
  string user_name = 5 [(api.query) = "user_name"];
  string email = 6 [(api.query) = "email"];
  string phone = 7 [(api.query) = "phone"];
  // common.Status 数值；0 为全部。
  int32 status = 8 [(api.query) = "status"];
  // 排序：created_at_desc（默认）/ created_at_asc / updated_at_desc / updated_at_asc。
  string sort = 9 [(api.query) = "sort"];
}

message ListUsersResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  repeated User users = 3[(api.go_tag)='json:"users"'];
  int64 total = 4[(api.go_tag)='json:"total"'];
}

message UpdateUserRequest {
  int64 organization_id = 1;
  int64 user_id = 2;
  string nickname = 3;
  string avatar = 4;
  common.Gender gender = 5;
  string birthday = 6;
  string bio = 7;
}

message UpdateUserResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  User user = 3[(api.go_tag)='json:"user"'];
}

message DisableUserRequest {
  int64 organization_id = 1;
  int64 user_id = 2;
}

message DisableUserResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

message EnableUserRequest {
  int64 organization_id = 1;
  int64 user_id = 2;
}

message EnableUserResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

// UserManagementHandler is the admin-side management API for an organization's
// end users (list / lookup / update / disable). All routes live under
// /api/v1/admin/... and take organization_id + user_id from the path.
service UserManagementHandler {
  rpc GetUser(GetUserRequest) returns(GetUserResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/users/:user_id";
  }

  rpc GetUserByIdentity(GetUserByIdentityRequest) returns(GetUserByIdentityResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/users/by-identity";
  }

  rpc ListUsers(ListUsersRequest) returns(ListUsersResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/users";
  }

  rpc UpdateUser(UpdateUserRequest) returns(UpdateUserResponse) {
    option (api.put) = "/api/v1/admin/organizations/:organization_id/users/:user_id";
  }

  rpc DisableUser(DisableUserRequest) returns(DisableUserResponse) {
    option (api.post) = "/api/v1/admin/organizations/:organization_id/users/:user_id/disable";
  }

  rpc EnableUser(EnableUserRequest) returns(EnableUserResponse) {
    option (api.post) = "/api/v1/admin/organizations/:organization_id/users/:user_id/enable";
  }

  // Admin uploads an avatar on behalf of a user in the organization. The image
  // is sent as multipart/form-data in the "avatar" field (read by the handler
  // via c.FormFile("avatar")). The request only carries the path selectors and
  // the response returns the updated user, so the existing GetUserRequest /
  // UpdateUserResponse messages are reused.
  rpc UploadUserAvatar(GetUserRequest) returns(UpdateUserResponse) {
    option (api.post) = "/api/v1/admin/organizations/:organization_id/users/:user_id/avatar";
  }
}

// --- self-service (end user operating on their own account) -----------------
// These carry NO organization_id / user_id: the identity is taken from the
// authenticated user token, so a user can only ever read / modify themselves.

message GetMyProfileRequest {}

message GetMyProfileResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  UserProfile profile = 3[(api.go_tag)='json:"profile"'];
}

message UpdateMyProfileRequest {
  string nickname = 1;
  string avatar = 2;
  common.Gender gender = 3;
  string birthday = 4;
  string bio = 5;
}

message UpdateMyProfileResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  UserProfile profile = 3[(api.go_tag)='json:"profile"'];
}

// BindIdentityRequest binds a login identity to the authenticated user.
// credential proves ownership of the identity being bound:
//   - email / phone : a verification code sent to that contact (bind scene)
//   - wechat         : a fresh OAuth authorization code (re-authorization)
// An identity already bound to another account returns a conflict.
message BindIdentityRequest {
  common.IdentityType identity_type = 1;
  string identity_value = 2;
  string credential = 3;
  reserved 4;
  reserved "confirm_merge";
}

message BindIdentityResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  UserIdentity identity = 3[(api.go_tag)='json:"identity"'];
  reserved 4 to 8;
  reserved "merged", "access_token", "refresh_token", "access_token_expires_at", "refresh_token_expires_at";
}

message UnbindIdentityRequest {
  common.IdentityType identity_type = 1;
  // identity_value narrows the unbind to one specific value; when empty, every
  // identity of that type is unbound. The user must keep at least one login
  // identity — unbinding the last one is rejected.
  string identity_value = 2;
}

message UnbindIdentityResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

message ListMyIdentitiesRequest {}

message ListMyIdentitiesResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  repeated UserIdentity identities = 3[(api.go_tag)='json:"identities"'];
}

// Upload a multipart/form-data image in the "avatar" field.
message UploadMyAvatarRequest {}
message UploadMyAvatarResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  string avatar = 3[(api.go_tag)='json:"avatar"'];
  UserProfile profile = 4[(api.go_tag)='json:"profile"'];
}

// IdentityHandler manages the identities bound to the authenticated user
// (phone / email / OAuth). Routes live under /api/v1/user/identities...
service IdentityHandler {
  rpc BindIdentity(BindIdentityRequest) returns(BindIdentityResponse) {
    option (api.post) = "/api/v1/user/identities/bind";
  }

  rpc UnbindIdentity(UnbindIdentityRequest) returns(UnbindIdentityResponse) {
    option (api.post) = "/api/v1/user/identities/:identity_type/unbind";
  }

  rpc ListMyIdentities(ListMyIdentitiesRequest) returns(ListMyIdentitiesResponse) {
    option (api.get) = "/api/v1/user/identities";
  }
}

// UserHandler is the self-service API: an authenticated end user reading and
// updating their own profile. Routes live under /api/v1/user/...
service UserHandler {
  rpc GetMyProfile(GetMyProfileRequest) returns(GetMyProfileResponse) {
    option (api.get) = "/api/v1/user/profile";
  }

  rpc UpdateMyProfile(UpdateMyProfileRequest) returns(UpdateMyProfileResponse) {
    option (api.put) = "/api/v1/user/profile";
  }

  rpc UploadMyAvatar(UploadMyAvatarRequest) returns(UploadMyAvatarResponse) {
    option (api.post) = "/api/v1/user/profile/avatar";
  }
}
