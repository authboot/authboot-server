syntax = "proto3";

package organization;

import "api.proto";
import "common.proto";

option go_package = "organization";

message Organization {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string logo = 4;
  common.Status status = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message CreateOrganizationRequest {
  string name = 1 [(api.vd) = "$!=''"];
  string code = 2 [(api.vd) = "$!=''"];
  string logo = 3;
}

message CreateOrganizationResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  Organization organization = 3[(api.go_tag)='json:"organization"'];
}

message GetOrganizationRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
}

message GetOrganizationResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  Organization organization = 3[(api.go_tag)='json:"organization"'];
}

message UpdateOrganizationRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
  string name = 2;
  string code = 3;
  string logo = 4;
  common.Status status = 5;
}

message UpdateOrganizationResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  Organization organization = 3[(api.go_tag)='json:"organization"'];
}

message DeleteOrganizationRequest {
  int64 organization_id = 1;
}

message DeleteOrganizationResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

message ListOrganizationsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListOrganizationsResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  repeated Organization organizations = 3[(api.go_tag)='json:"organizations"'];
  int64 total = 4[(api.go_tag)='json:"total"'];
}

// 上传 / 更改组织 logo。图片文件通过 multipart/form-data 上传，
// 表单字段名为 logo，由 handler 通过 c.FormFile("logo") 读取，
// 因此请求体本身只携带路径参数。
message UploadOrganizationLogoRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
  bytes data = 2 [(api.form) = "data"];
}

message UploadOrganizationLogoResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  // 上传后的 logo 访问地址
  string logo = 3[(api.go_tag)='json:"logo"'];
  Organization organization = 4[(api.go_tag)='json:"organization"'];
}

// 离开组织。操作者身份取自鉴权上下文（JWT），无需在请求体中携带账号 id。
message LeaveOrganizationRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
}

message LeaveOrganizationResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

// ============================================================
// 组织设置（Organization Settings）
//   管理端可配置：admin 登录 token 有效时长、组织下普通用户可用的登录方式等。
//   注意：hz codegen 暂不可用，biz/model/organization/settings.go 手工维护，
//   与下方 message 保持一致；跑通 hz update 后可删除手工 DTO。
// ============================================================

// 组织设置：admin_token_ttl_seconds 为 0 表示使用全局默认值。
// 字段显式声明 json tag（不带 omitempty），保证设置接口始终返回完整状态。
message OrganizationSettings {
  int64 admin_token_ttl_seconds = 1[(api.go_tag)='json:"admin_token_ttl_seconds"'];
  LoginMethods login_methods = 2[(api.go_tag)='json:"login_methods"'];
  Maintenance maintenance = 3[(api.go_tag)='json:"maintenance"'];
  PasswordPolicy password_policy = 4[(api.go_tag)='json:"password_policy"'];
}

// 组织下普通用户的密码策略（注册 / 改密 / 重置时校验）。结构化规则而非正则，
// 便于前端生成提示和实时勾选；最大长度固定 72（bcrypt 限制），不开放配置。
message PasswordPolicy {
  // 最小长度，8–72。
  int32 min_length = 1[(api.go_tag)='json:"min_length"'];
  bool require_lowercase = 2[(api.go_tag)='json:"require_lowercase"'];
  bool require_uppercase = 3[(api.go_tag)='json:"require_uppercase"'];
  bool require_digit = 4[(api.go_tag)='json:"require_digit"'];
  bool require_symbol = 5[(api.go_tag)='json:"require_symbol"'];
  // 密码被拒时展示给用户的提示；为空时由服务端根据规则生成。
  string hint = 6[(api.go_tag)='json:"hint"'];
}

// 维护模式：开启后组织下普通用户的登录 / 注册 / 找回密码被拒绝，并返回公告。
// 管理端登录不受影响。
message Maintenance {
  bool enabled = 1[(api.go_tag)='json:"enabled"'];
  // 公告标题与正文，开启时必填。
  string title = 2[(api.go_tag)='json:"title"'];
  string message = 3[(api.go_tag)='json:"message"'];
  // 预计恢复时间（unix 秒），0 表示未设置；仅用于展示，不会自动结束维护。
  int64 expected_end = 4[(api.go_tag)='json:"expected_end"'];
  // 本次维护开启时间（unix 秒），由服务端在开启时写入，关闭时清零。
  int64 started_at = 5[(api.go_tag)='json:"started_at"'];
}

// 组织下普通用户（非 admin）可用的登录方式开关
message LoginMethods {
  bool email_password = 1[(api.go_tag)='json:"email_password"'];             // 邮箱 + 密码
  bool email_code = 2[(api.go_tag)='json:"email_code"'];                     // 邮箱验证码
  bool phone_code = 3[(api.go_tag)='json:"phone_code"'];                     // 手机验证码
  repeated string oauth_providers = 4[(api.go_tag)='json:"oauth_providers"']; // 允许的三方登录提供商（wechat/google/apple/github/alipay）
}

message GetOrganizationSettingsRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
}

message GetOrganizationSettingsResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  OrganizationSettings settings = 3[(api.go_tag)='json:"settings"'];
}

message UpdateOrganizationSettingsRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
  OrganizationSettings settings = 2[(api.go_tag)='json:"settings"'];
}

message UpdateOrganizationSettingsResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  OrganizationSettings settings = 3[(api.go_tag)='json:"settings"'];
}

// ------------------------------------------------------------
// 用户端公开接口：登录页在渲染前查询组织是否维护中，用于展示完整公告。
// 无需登录；只暴露公告本身，不含 started_at 等内部字段。
// ------------------------------------------------------------
message GetMaintenanceNoticeRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
}

message MaintenanceNotice {
  bool enabled = 1[(api.go_tag)='json:"enabled"'];
  string title = 2[(api.go_tag)='json:"title"'];
  string message = 3[(api.go_tag)='json:"message"'];
  // 预计恢复时间（unix 秒），0 表示未设置。
  int64 expected_end = 4[(api.go_tag)='json:"expected_end"'];
}

message GetMaintenanceNoticeResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  MaintenanceNotice maintenance = 3[(api.go_tag)='json:"maintenance"'];
  // 生效的密码策略，供注册 / 改密表单做实时校验提示。
  PasswordPolicy password_policy = 4[(api.go_tag)='json:"password_policy"'];
}

service OrganizationHandler {
  rpc CreateOrganization(CreateOrganizationRequest) returns(CreateOrganizationResponse) {
    option (api.post) = "/api/v1/admin/organizations";
  }

  rpc GetOrganization(GetOrganizationRequest) returns(GetOrganizationResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id";
  }

  rpc UpdateOrganization(UpdateOrganizationRequest) returns(UpdateOrganizationResponse) {
    option (api.put) = "/api/v1/admin/organizations/:organization_id";
  }

  rpc DeleteOrganization(DeleteOrganizationRequest) returns(DeleteOrganizationResponse) {
    option (api.delete) = "/api/v1/admin/organizations/:organization_id";
  }

  rpc ListOrganizations(ListOrganizationsRequest) returns(ListOrganizationsResponse) {
    option (api.get) = "/api/v1/admin/organizations";
  }

  // 上传 / 更改组织 logo（multipart/form-data，文件字段名 logo）
  rpc UploadOrganizationLogo(UploadOrganizationLogoRequest) returns(UploadOrganizationLogoResponse) {
    option (api.post) = "/api/v1/admin/organizations/:organization_id/logo";
  }

  // 离开组织
  rpc LeaveOrganization(LeaveOrganizationRequest) returns(LeaveOrganizationResponse) {
    option (api.post) = "/api/v1/admin/organizations/:organization_id/leave";
  }

  // 查询组织设置
  rpc GetOrganizationSettings(GetOrganizationSettingsRequest) returns(GetOrganizationSettingsResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/settings";
  }

  // 整体替换组织设置
  rpc UpdateOrganizationSettings(UpdateOrganizationSettingsRequest) returns(UpdateOrganizationSettingsResponse) {
    option (api.put) = "/api/v1/admin/organizations/:organization_id/settings";
  }

  // 公开：组织维护公告（登录页用，无需登录）。
  rpc GetMaintenanceNotice(GetMaintenanceNoticeRequest) returns(GetMaintenanceNoticeResponse) {
    option (api.get) = "/api/v1/user/organizations/:organization_id/maintenance";
  }
}