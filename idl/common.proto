syntax = "proto3";

package common;

import "api.proto";

option go_package = "common";

enum Status {
  STATUS_UNKNOWN = 0;
  STATUS_ENABLED = 1;
  STATUS_DISABLED = 2;
}

enum ClientType {
  CLIENT_TYPE_UNKNOWN = 0;
  CLIENT_TYPE_IOS = 1;
  CLIENT_TYPE_ANDROID = 2;
  CLIENT_TYPE_H5 = 3;
  CLIENT_TYPE_MINI_PROGRAM = 4;
  CLIENT_TYPE_WEB = 5;
}

enum IdentityType {
  IDENTITY_TYPE_UNKNOWN = 0;
  IDENTITY_TYPE_EMAIL = 1;
  IDENTITY_TYPE_PHONE = 2;
  IDENTITY_TYPE_GOOGLE = 10;
  IDENTITY_TYPE_APPLE = 11;
  IDENTITY_TYPE_WECHAT = 12;
  IDENTITY_TYPE_GITHUB = 13;
}

enum Gender {
  GENDER_UNKNOWN = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}

message PageRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message PageResponse {
  int64 total = 1;
  int32 page = 2;
  int32 page_size = 3;
}