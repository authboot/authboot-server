syntax = "proto3";

package oauth;

import "api.proto";
import "auth.proto";

option go_package = "oauth";

// ============================================================
// 第三方 OAuth 登录接入
//   1. 平台管理员（Admin）为某个 Organization 配置 OAuth 身份提供商
//      (wechat / alipay / github / ...) 的接入凭证。
//   2. 一旦某 Organization 配置并启用了某 provider，该 Organization 下的
//      普通用户（Organization User）即可使用该 provider 完成授权登录。
// 配置以 (organization_id, provider) 为唯一维度，provider 私有字段统一放入
// settings，新增 provider 无需改动结构；后端加密持久化。
// ============================================================

// 某 Organization 为某个 OAuth provider 配置的接入凭证。
message OAuthProviderConfig {
  int64 organization_id = 1 [(api.go_tag)='json:"organization_id"'];
  // provider 标识，小写，如 "wechat" / "alipay" / "github"。
  string provider = 2 [(api.go_tag)='json:"provider"'];
  // settings 为 provider 私有配置键值对。以 wechat 为例：
  //   app_id / app_secret / redirect_uri / scope。
  // 读取接口（Get/List）返回时，敏感字段（如 app_secret）会被脱敏，不回传明文。
  map<string, string> settings = 3 [(api.go_tag)='json:"settings"'];
  bool enabled = 4 [(api.go_tag)='json:"enabled"'];
  int64 created_at = 5 [(api.go_tag)='json:"created_at"'];
  int64 updated_at = 6 [(api.go_tag)='json:"updated_at"'];
}

// ------------------------------------------------------------
// 一、管理端：Admin 为 Organization 管理 OAuth 配置
//   路径以 organization_id 为边界，与 RBAC 等管理接口保持一致。
// ------------------------------------------------------------

// 新增或更新（upsert）某 Organization 下某 provider 的配置。
message SetOAuthConfigRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
  string provider = 2 [(api.path) = "provider", (api.vd) = "$!=''"];
  // 完整覆盖该 provider 的私有配置（app_id/app_secret/redirect_uri/scope...）。
  map<string, string> settings = 3;
  bool enabled = 4;
}

message SetOAuthConfigResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  OAuthProviderConfig config = 3[(api.go_tag)='json:"config"'];
}

message GetOAuthConfigRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
  string provider = 2 [(api.path) = "provider", (api.vd) = "$!=''"];
}

message GetOAuthConfigResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  OAuthProviderConfig config = 3[(api.go_tag)='json:"config"'];
}

message ListOAuthConfigsRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
}

message ListOAuthConfigsResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  repeated OAuthProviderConfig configs = 3[(api.go_tag)='json:"configs"'];
  int64 total = 4[(api.go_tag)='json:"total"'];
}

message DeleteOAuthConfigRequest {
  int64 organization_id = 1 [(api.path) = "organization_id", (api.vd) = "$!=''"];
  string provider = 2 [(api.path) = "provider", (api.vd) = "$!=''"];
}

message DeleteOAuthConfigResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

// OAuth 配置管理服务（平台管理员，Organization 维度）
service OAuthAdminHandler {
  // upsert：同一 (organization_id, provider) 已存在则更新，否则新建。
  rpc SetOAuthConfig(SetOAuthConfigRequest) returns(SetOAuthConfigResponse) {
    option (api.put) = "/api/v1/admin/organizations/:organization_id/oauth/:provider";
  }

  rpc GetOAuthConfig(GetOAuthConfigRequest) returns(GetOAuthConfigResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/oauth/:provider";
  }

  rpc ListOAuthConfigs(ListOAuthConfigsRequest) returns(ListOAuthConfigsResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/oauth";
  }

  rpc DeleteOAuthConfig(DeleteOAuthConfigRequest) returns(DeleteOAuthConfigResponse) {
    option (api.delete) = "/api/v1/admin/organizations/:organization_id/oauth/:provider";
  }
}

// ------------------------------------------------------------
// 二、用户端：Organization User 使用已配置的 provider 授权登录
//   仅当该 Organization 已配置并启用对应 provider 时可用。
// ------------------------------------------------------------

// 第一步：获取 provider 授权页 URL，前端据此跳转/弹出扫码。
message GetOAuthAuthorizeURLRequest {
  int64 organization_id = 1 [(api.query) = "organization_id", (api.vd) = "$!=''"];
  string provider = 2 [(api.path) = "provider", (api.vd) = "$!=''"];
  // 可选：覆盖回调地址；为空则用配置里的 redirect_uri。
  string redirect_uri = 3 [(api.query) = "redirect_uri"];
  // 可选：防 CSRF 的 state；为空则服务端生成并返回。
  string state = 4 [(api.query) = "state"];
}

message GetOAuthAuthorizeURLResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  string authorize_url = 3[(api.go_tag)='json:"authorize_url"'];
  string state = 4[(api.go_tag)='json:"state"'];
}

// 第二步：provider 回调拿到 code 后换取登录态。
// 返回复用 auth.LoginResponse，与普通登录同构（user + token + session）。
message OAuthLoginRequest {
  int64 organization_id = 1 [(api.vd) = "$!=''"];
  int64 client_id = 2;
  string provider = 3 [(api.path) = "provider", (api.vd) = "$!=''"];
  string code = 4 [(api.vd) = "$!=''"];
  string state = 5;
  string device_id = 6;
  string device_name = 7;
}

// OAuth 用户登录服务（Organization User）
service OAuthUserHandler {
  rpc GetOAuthAuthorizeURL(GetOAuthAuthorizeURLRequest) returns(GetOAuthAuthorizeURLResponse) {
    option (api.get) = "/api/v1/user/oauth/:provider/authorize";
  }

  rpc OAuthLogin(OAuthLoginRequest) returns(auth.LoginResponse) {
    option (api.post) = "/api/v1/user/oauth/:provider/login";
  }
}