syntax = "proto3";

package membership;

import "api.proto";

option go_package = "membership";

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNKNOWN = 0;
  MEMBERSHIP_STATUS_PENDING = 1;
  MEMBERSHIP_STATUS_ACTIVE = 2;
  MEMBERSHIP_STATUS_DISABLED = 3;
  MEMBERSHIP_STATUS_REMOVED = 4;
}

message OrganizationMembership {
  int64 id = 1;
  int64 organization_id = 2;
  int64 account_id = 3;
  MembershipStatus status = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

message GetMembershipRequest {
  int64 membership_id = 1;
}

message GetMembershipResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  OrganizationMembership membership = 3[(api.go_tag)='json:"membership"'];
}

message ListMembersRequest {
  int64 organization_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListMembersResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
  repeated OrganizationMembership members = 3[(api.go_tag)='json:"members"'];
  int64 total = 4[(api.go_tag)='json:"total"'];
}

message RemoveMemberRequest {
  int64 membership_id = 1;
}

message RemoveMemberResponse {
  int32 code = 1[(api.go_tag)='json:"code"'];
  string message = 2[(api.go_tag)='json:"message"'];
}

service MembershipHandler {
  rpc GetMembership(GetMembershipRequest) returns(GetMembershipResponse) {
    option (api.get) = "/api/v1/admin/memberships/:membership_id";
  }

  rpc ListMembers(ListMembersRequest) returns(ListMembersResponse) {
    option (api.get) = "/api/v1/admin/organizations/:organization_id/members";
  }

  rpc RemoveMember(RemoveMemberRequest) returns(RemoveMemberResponse) {
    option (api.delete) = "/api/v1/admin/memberships/:membership_id";
  }
}